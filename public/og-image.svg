<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <rect width="1200" height="630" fill="#080b11"/>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0e7490" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#080b11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.1" stroke="#22d3ee" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>

  <!-- Hexagon Brand Mark -->
  <g transform="translate(100, 100)">
    <path d="M40 0L74.6 20V60L40 80L5.4 60V20L40 0Z" fill="#0e7490" fill-opacity="0.3" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="40" cy="40" r="12" fill="#22d3ee"/>
  </g>

  <!-- Brand Label Badge -->
  <g transform="translate(200, 110)">
    <rect width="250" height="42" rx="21" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="25" y="26" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="1">100% IN-BROWSER SUITE</text>
  </g>

  <!-- Big Title -->
  <text x="100" y="270" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">AHADEX TOOLS</text>

  <!-- Subtitle -->
  <text x="100" y="340" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="400">
    Futuristic, High-Performance Web Utilities &amp; Developer Suite
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">🔒 Zero Cloud Upload</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="230" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="264" y="30" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">⚡ Client-Side RAM</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="220" height="48" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="514" y="30" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600">📄 PDF, Media &amp; Dev</text>
  </g>

  <!-- Footer link -->
  <text x="100" y="550" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="600">https://ahadex.fun</text>
</svg>
